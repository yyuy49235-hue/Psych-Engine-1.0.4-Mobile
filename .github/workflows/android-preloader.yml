name: Android Preloader Build

# Builds the development branch WITHOUT merging into main.
# Run it from the Actions tab: "Android Preloader Build" -> "Run workflow" -> pick full-mod-preloader.
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Android application id (use the ORIGINAL id only if you also provide the ORIGINAL signing key as secrets)"
        required: false
        default: "com.shadowmario.psychengine.preloader"
  push:
    branches: [ full-mod-preloader ]

jobs:
  Android:
    name: Android Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set application id
        env:
          PKG: ${{ github.event.inputs.package_name }}
        run: |
          PKG="${PKG:-com.shadowmario.psychengine.preloader}"
          echo "Using application id: $PKG"
          sed -i "s/packageName=\"com.shadowmario.psychengine\"/packageName=\"$PKG\"/; s/ package=\"com.shadowmario.psychengine\"/ package=\"$PKG\"/" Project.xml
          grep -n 'packageName' Project.xml

      - name: Setting up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          key: cache-build-android-preloader-${{ hashFiles('hmm.json', 'Project.xml') }}
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-preloader-

      - name: Install Haxelib
        run: |
          haxelib install hmm --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib run hmm install --quiet

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Configuring Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Compile
        run: |
          set -o pipefail
          haxelib run lime build android -final -v 2>&1 | tee build.log

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          SRC=$(ls export/release/android/bin/app/build/outputs/apk/release/*.apk | head -n1)
          echo "Built: $SRC"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > signing.jks
            ALIAS="$KS_ALIAS"
            echo "Signing with the keystore provided in repository secrets."
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            ALIAS=preloader
            keytool -genkeypair -keystore signing.jks -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PsychPreloader"
            echo "::warning::No signing secrets found. Using a throw-away key: this APK can NOT update an APK from another build or the original game."
          fi
          export PASS
          "$BT/zipalign" -p -f 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks signing.jks --ks-key-alias "$ALIAS" --ks-pass env:PASS --key-pass env:PASS --out PsychEngine-Preloader.apk aligned.apk
          "$BT/apksigner" verify --print-certs PsychEngine-Preloader.apk | grep -i "SHA-256"
          "$BT/aapt" dump badging PsychEngine-Preloader.apk | grep -E "package:|application-label:"
          rm -f signing.jks

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-Preloader-APK
          path: PsychEngine-Preloader.apk
          if-no-files-found: error

      - name: Publish build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            export/release/android/bin/app/build/reports/**
          if-no-files-found: ignore
